name: Build Android APK (Local Gradle)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: 📱 Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Disable R8 / Minify to prevent stripping missing Expo classes
        working-directory: android/app
        run: |
          sed -i 's/def enableProguardInReleaseBuilds = .*/def enableProguardInReleaseBuilds = false/' build.gradle
          echo "-ignorewarnings" >> proguard-rules.pro
          echo "-keep class expo.modules.** { *; }" >> proguard-rules.pro

      - name: 🛠️ Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 🏗️ Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: 📦 Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./Motion-v1.0.apk
          echo "apk_path=./Motion-v1.0.apk" >> $GITHUB_OUTPUT

      - name: 🚀 Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Motion App v1.0.${{ github.run_number }} (Release APK)"
          body: |
            ### 🎬 Motion App - Direct Download
            Directly compiled Android APK. Ready to install!
            
            **Features included:**
            - 🎙️ SRT to Animated Caption Video
            - 🎨 20 Motion Graphic Templates
            - 🖼️ Logo watermark & customization
            - 🔊 Sound Effects & Audio sync
            - 📐 9:16 Reel & 16:9 YouTube format
          files: ./Motion-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
